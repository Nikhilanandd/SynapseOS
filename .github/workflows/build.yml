name: Build SynapseOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Clean Workspace
        run: |
          sudo rm -rf .build cache chroot binary output
          sudo rm -rf config/apt config/archives config/bootloaders config/debian-installer
          sudo rm -rf config/rootfs config/packages* config/preseed
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Repository
        run: ./scripts/validate.sh

  build:
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Clean Workspace
        run: |
          sudo rm -rf .build cache chroot binary output
          sudo rm -rf config/apt config/archives config/bootloaders config/debian-installer
          sudo rm -rf config/rootfs config/packages* config/preseed
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SynapseOS
        run: sudo ./build.sh
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapseos-build
          path: output/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: synapseos-build
          path: output/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
