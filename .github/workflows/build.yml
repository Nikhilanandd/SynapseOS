name: Build SynapseOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Clean Workspace
        run: |
          sudo umount -lf chroot/dev chroot/proc chroot/sys chroot/run 2>/dev/null || true
          sudo umount -lf .build/ 2>/dev/null || true
          sudo rm -rf .build cache chroot binary output local
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Repository
        run: ./scripts/validate.sh

  build:
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Clean Workspace
        run: |
          sudo umount -lf chroot/dev chroot/proc chroot/sys chroot/run 2>/dev/null || true
          sudo umount -lf .build/ 2>/dev/null || true
          sudo rm -rf .build chroot binary output local
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SynapseOS
        run: sudo ./build.sh
      - name: QEMU Boot Test
        continue-on-error: true
        run: |
          if [ -e /dev/kvm ]; then
            sudo apt-get install -y -qq qemu-system-x86 qemu-kvm ovmf
            ./scripts/test-qemu.sh
          else
            echo "KVM not available, skipping boot test"
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapseos-build
          path: output/
          retention-days: 30
      - name: Post-Build Cleanup
        if: always()
        run: |
          sudo umount -lf chroot/dev chroot/proc chroot/sys chroot/run 2>/dev/null || true
          sudo umount -lf .build/ 2>/dev/null || true
          sudo rm -rf .build chroot binary output local
          # Keep cache/ for incremental builds

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: synapseos-build
          path: output/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
